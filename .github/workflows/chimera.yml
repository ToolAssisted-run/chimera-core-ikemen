name: chimera waterbox core

# Builds the core from a fresh clone, tests it, and publishes the package.
#
# Everything the tests need comes with the clone: the Ikemen GO screenpack
# (a submodule, from which tests/make-test-game.sh makes the test game; it is
# never packaged) and this repository's probe (tests/probe). So every test
# runs here, as before a push:
#   - the native reference and the sandboxed core are the same machine
#     (pictures, sound, steps, the probe's printed lines), with savestates;
#   - the clock, random numbers, controls, save data and the refusals (the
#     probe);
#   - the package in Chimera's headless runner and in its window, with the
#     game's properties;
#   - Chimera's own checks of the package.
#
# LLVM (for llvmpipe, the software OpenGL) and Mesa take most of an hour to
# build here and change only with their scripts, so they are cached. Go
# fetches the modules Ikemen GO is built from from its module proxy.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # A nightly is published only when main moved since the last one; the
    # shared publishing workflow checks.
    - cron: '25 6 * * *'

# Keyed by the event as well as the branch: otherwise the nightly schedule
# and a push to main cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  gate:
    name: build and test (native against sandbox, the package, Chimera's package checks)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        # The lib*-dev packages are what Chimera's own build needs; this core
        # links none of them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 python3-mako python3-packaging python3-pip curl xz-utils patch mono-complete xvfb libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build Chimera's engine
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build Chimera's interface
        working-directory: chimera-checkout
        run: dotnet build source/gui/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Cache miniBox's sandbox toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (the sandbox, and its C++ toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Cache LLVM and Mesa
        uses: actions/cache@v4
        with:
          path: |
            build/llvm-native
            build/llvm-guest
            build/mesa
            build/deps
          key: llvm-mesa-${{ runner.os }}-${{ hashFiles('waterbox/build-llvm.sh', 'waterbox/guest-toolchain.cmake', 'waterbox/setup-mesa.sh', 'waterbox/mesa-patches/*') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}

      - name: Build LLVM and Mesa (when not cached)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          bash ./waterbox/build-llvm.sh native
          bash ./waterbox/build-llvm.sh guest -m "$mb"
          bash ./waterbox/setup-mesa.sh -n
          bash ./waterbox/setup-mesa.sh -m "$mb"

      - name: Run the test script
        # It builds FFmpeg and Ikemen GO for both, links both, and runs the tests. A run in
        # which these did not pass has tested nothing, so they are asked for
        # by name.
        run: |
          rc=0
          bash ./waterbox/run-gate.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox" > gate.out 2>&1 || rc=$?
          grep -v '^miniBox:' gate.out
          [ "$rc" -eq 0 ]
          for t in equivalence rerecord session turbo teeth renderer clock random controls "save data" videos refusals; do
            grep -q "^PASS $t:" gate.out || { echo "$t did not pass"; exit 1; }
          done

      - name: Build the package
        # The commit is the version the package is stamped with: this is the
        # build that is published, so it is what a movie can name. A package
        # built by hand is stamped "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: bash ./waterbox/build-package.sh -r "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Run the frontend test
        # The package through Chimera's headless runner and its window
        # (under Mono, on a virtual display), against the native reference.
        run: |
          rc=0
          bash ./tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout" > window.out 2>&1 || rc=$?
          cat window.out
          [ "$rc" -eq 0 ]
          for t in package engine:movie engine:project window:project window:properties window:keybinds; do
            grep -q "^$t  *PASS " window.out || { echo "$t did not pass"; exit 1; }
          done

      - name: Chimera's checks of the package
        working-directory: chimera-checkout
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/chimera-checkout/build/Cores
        run: |
          dotnet test source/gui/Chimera.Tests.Client.Common/Chimera.Tests.Client.Common.csproj \
            -c Release --nologo \
            --filter "FullyQualifiedName~InstalledCorePackagesTests|FullyQualifiedName~MnemonicUniquenessTests"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: ikemen-${{ github.sha }}
          path: chimera-checkout/build/Cores/ikemen.chimeraCore
          if-no-files-found: error

      - name: Upload the test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            gate.out
            window.out
            build/*.log

  publish:
    # What passed above, published as this core's own release: a rolling `dev`
    # on every push to main, a dated `nightly-YYYY-MM-DD` from the scheduled
    # run, through the one workflow every Chimera core publishes with.
    name: publish
    needs: [ gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: ikemen
      artifact: ikemen-${{ github.sha }}
      package: ikemen.chimeraCore
      kind: ${{ github.event.inputs.kind }}
